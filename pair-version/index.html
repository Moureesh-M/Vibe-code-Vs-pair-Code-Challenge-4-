<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Task Manager</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app">
    <h1 class="app-title">Personal Task Manager</h1>

    <section class="task-input-row" aria-label="Add a task">
      <input
        id="task-input"
        class="task-input"
        type="text"
        placeholder="Enter a task..."
        aria-label="Task title"
      >
      <button id="add-task-btn" class="add-btn" type="button">Add</button>
    </section>

    <section class="task-list-section" aria-label="Task list">
      <ul id="task-list" class="task-list"></ul>
    </section>

    <section class="filters" aria-label="Filter tasks">
      <button class="filter-btn is-active" type="button" data-filter="all">All</button>
      <button class="filter-btn" type="button" data-filter="active">Active</button>
      <button class="filter-btn" type="button" data-filter="completed">Completed</button>
    </section>

    <p id="task-count" class="task-count">0 tasks remaining</p>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
